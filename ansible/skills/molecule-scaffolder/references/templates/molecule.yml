---
role_name_check: 1
dependency:
  name: galaxy
driver:
  name: ${CONTAINER_ENGINE:-docker}
platforms:
  - name: debian12
    image: debian:12.15
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: ""
    privileged: true
  - name: ubuntu2404
    image: ubuntu:noble-20260917
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: ""
    privileged: true
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      inject_facts_as_vars: false
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
