---
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forcetypeassert
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/hashicorp/terraform-plugin-sdk/v2
              desc: Use the Terraform Plugin Framework
  exclusions:
    presets:
      - comments
      - std-error-handling
    paths:
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
